[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "simteleop-agent"
version = "0.1.0"
description = "Strands agent (Amazon Bedrock) that teleoperates the simulated SO-101 through the env server"
requires-python = ">=3.10"
dependencies = [
    "simteleop-common",
    "strands-agents==1.57.1",
    "boto3>=1.40,<2",
    "numpy>=1.24",
]

[project.scripts]
simteleop-agent = "simteleop_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["simteleop_agent*"]
