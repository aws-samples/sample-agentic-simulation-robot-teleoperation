[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "simteleop-common"
version = "0.1.0"
description = "Wire protocol and geometry shared by the SO-101 env server and agent"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
include = ["simteleop_common*"]

[tool.setuptools.package-data]
simteleop_common = ["solution.json"]
